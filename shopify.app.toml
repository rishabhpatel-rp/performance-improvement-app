# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f3c38e708010aaa3be8bcdc18e3e03a6"
name = "Performance-improvement-app"
application_url = "https://pagepulsespeed.node.brainvire.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
# Aligned with ApiVersion.July26 in app/shopify.server.js (REMEDIATION Task 5).
# Bump both together, and re-check webhook payload shapes, when upgrading.
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  # DECISION NEEDED (REMEDIATION_PROMPT.md Task 6): this app config file has
  # never, at any point in its history, declared compliance_topics, even
  # though app/routes/webhooks.compliance.jsx exists specifically to handle
  # these three topics. Added here as the safe default since it's a
  # mandatory Shopify App Store requirement and the handler is already
  # correct — but verify in the Partner Dashboard for
  # client_id = f3c38e708010aaa3be8bcdc18e3e03a6 whether these are already
  # registered out-of-band before deploying, and run `shopify app deploy`
  # (or equivalent) once confirmed — a toml edit alone does not register it.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[app_proxy]
url = "/api/storefront-scripts"
prefix = "apps"
subpath = "performance-scripts"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_themes,write_app_proxy,write_metaobject_definitions,write_metaobjects,write_products"

[auth]
redirect_urls = [ "https://pagepulsespeed.node.brainvire.dev/auth/callback" ]

[metaobjects.app.script_injector_config]
name = "Config"
description = "Script injector configuration"

  [metaobjects.app.script_injector_config.access]
  admin = "merchant_read_write"

[metaobjects.app.script_injector_config.fields.app_enabled]
name = "App Enabled"
type = "boolean"

[metaobjects.app.script_injector_config.fields.script_1_enabled]
name = "Script 1 Enabled"
type = "boolean"

[metaobjects.app.script_injector_config.fields.script_2_enabled]
name = "Script 2 Enabled"
type = "boolean"

[metaobjects.app.script_injector_config.fields.script_3_enabled]
name = "Script 3 Enabled"
type = "boolean"

[metaobjects.app.script_injector_config.fields.script_titles]
name = "Script Titles"
type = "list.single_line_text_field"

[metaobjects.app.script_injector_config.fields.debug_mode]
name = "Debug Mode"
type = "boolean"

[metaobjects.app.script_injector_config.fields.audit_defer_array]
name = "Audit Defer Array"
type = "list.single_line_text_field"

[metaobjects.app.script_injector_config.fields.audit_hide_selectors]
name = "Audit Hide Selectors"
type = "list.single_line_text_field"

[metaobjects.app.script_injector_config.fields.audit_complete]
name = "Audit Complete"
type = "boolean"

[metaobjects.app.script_injector_config.fields.app_endpoint]
name = "App Endpoint"
description = "Public /audit-submit URL of this app. Auto-populated from SHOPIFY_APP_URL on dashboard load; read by the storefront audit script (storefront public_read)."
type = "url"
