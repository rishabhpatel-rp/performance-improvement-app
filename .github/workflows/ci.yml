name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shopify-app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run check:schema
      - run: npx prisma migrate deploy
      - name: CQ-17 — migrations must match schema.prisma
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm test
      - run: npm run test:integration
      # Lint/typecheck/format stay non-blocking until the backlog is cleared;
      # tests + schema/migrate checks are the merge gate.
      - run: npm run lint
        continue-on-error: true
      - run: npm run typecheck
        continue-on-error: true
      - run: npm run format:check
        continue-on-error: true

  admin-panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    env:
      # auth.ts throws at import if missing; merchant-route tests pull it in.
      ADMIN_SESSION_PASSWORD: "ci-only-admin-session-password-min-32-chars"
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npm test
      # Lint/typecheck/format stay non-blocking until the backlog is cleared;
      # tests + schema validate are the merge gate.
      - run: npm run lint
        continue-on-error: true
      - run: npm run typecheck
        continue-on-error: true
      - run: npm run format:check
        continue-on-error: true
