version: 2
updates:
  # Main Shopify app (React Router + Node)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Admin panel (Next.js)
  - package-ecosystem: "npm"
    directory: "/admin-panel"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
